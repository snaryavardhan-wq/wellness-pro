services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
  api:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/wellness
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo
volumes:
  mongo-data: